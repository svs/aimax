[package]
name = "aimax_core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
crate-type = ["rlib"]

[dependencies]
# Rope data structure for efficient text editing
ropey = "1.6"

# Tree-sitter for parsing, syntax highlighting, structural editing
tree-sitter = "0.24"
tree-sitter-highlight = "0.24"

# Language grammars (add as needed)
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-json = "0.24"

# Fuzzy matching (used by Helix)
nucleo = "0.5"
nucleo-matcher = "0.3"

# Path utilities
dirs = "5"

# Steel Scheme for scripting
steel-core = "0.7"

# PTY for process buffers (shells, AI agents)
portable-pty = "0.8"

# Strip ANSI escape codes from process output
strip-ansi-escapes = "0.2"

# HTTP client with streaming (for AI chat)
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
futures = "0.3"

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Multi-provider LLM client (no AWS Bedrock, no CLI, no API server)
llm = { version = "1.3.7", default-features = false, features = [
    "anthropic",
    "openai",
    "ollama",
    "google",
    "deepseek",
    "groq",
    "xai",
] }
